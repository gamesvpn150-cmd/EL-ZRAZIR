<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELZRAZIR | Discord</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#050509;color:#fff}
video.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(1.15);z-index:0}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at center,transparent 0,rgba(0,0,0,.2) 35%,rgba(0,0,0,.78) 100%);z-index:1}
.card{position:fixed;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:34px 28px;width:min(90%,480px);border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(10,10,18,.52);backdrop-filter:blur(12px);box-shadow:0 20px 80px rgba(0,0,0,.55)}
h1{margin:0 0 8px;font-size:clamp(42px,11vw,82px);letter-spacing:4px;text-shadow:0 0 28px rgba(150,100,255,.8)}
p{margin:0 0 24px;font-size:18px;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:17px 32px;border-radius:999px;background:#fff;color:#09090d;text-decoration:none;font-weight:800;font-size:18px;box-shadow:0 0 35px rgba(255,255,255,.25);transition:.2s}
.btn:hover{transform:scale(1.05);box-shadow:0 0 45px rgba(255,255,255,.5)}
.music{position:fixed;z-index:3;left:18px;bottom:18px;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,15,.65);color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}
.note{font-size:12px;opacity:.55;margin-top:16px}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline>
  <source src="./game_video.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<main class="card">
  <h1>ELZRAZIR</h1>
  <p>مهرجان ترتيبي في مجالي رقم واحد غصب عنكو 🔥</p>
  <a class="btn" href="https://discord.gg/NR9bmYZP7" target="_blank" rel="noopener">⚡ ادخل سيرفر الديسكورد ⚡</a>
  <div class="note">اضغط الزر للدخول إلى السيرفر</div>
</main>
<button class="music" id="music">🎵 تشغيل الصوت</button>
<audio id="audio" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<script>
const b=document.getElementById('music'),a=document.getElementById('audio');
b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='🔊 إيقاف الصوت'}else{a.pause();b.textContent='🎵 تشغيل الصوت'}}catch(e){}};
</script>
</body>
</html>
